<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1E1F22">
  <meta name="description" content="Humber Esports League of Legends team ranked history graph.">
  <title>Humber Esports | Team Ranked History</title>
  <style>
    html { background: #1E1F22; }
    body { margin: 0; min-height: 100vh; background: #1E1F22; color: #F2F3F5; font-family: system-ui, sans-serif; }
    main { width: 100%; box-sizing: border-box; padding: clamp(6px, 1vw, 18px); }
    img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <main>
    <img src="solo_progress.png" alt="Humber Esports Solo/Duo LP progression for the last 30 days">
  </main>
  <script>
    const graph = document.querySelector('main img');
    function refreshGraph() {
      graph.src = 'solo_progress.png?v=' + Date.now();
    }
    refreshGraph();
    setInterval(refreshGraph, 15 * 60 * 1000);
  </script>
</body>
</html>
